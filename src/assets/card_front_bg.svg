<?xml version="1.0" encoding="UTF-8"?>
<svg id="svgF" viewBox="0 0 300 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cf"><rect width="300" height="480" rx="18"/></clipPath>

    <!-- 3-state diamond pattern: light fill / dark fill / empty (no fill) cycling -->
    <!-- We tile with 3 rows of 3 to get all 3 variants -->
    <pattern id="dp" x="0" y="0" width="54" height="36" patternUnits="userSpaceOnUse">
      <!-- Row 1 -->
      <!-- diamond 1: light fill -->
      <polygon points="9,0  18,6  9,12  0,6" fill="rgba(0,0,0,0.04)" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <!-- diamond 2: no fill (empty outline only) -->
      <polygon points="27,0 36,6  27,12 18,6" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <!-- diamond 3: darker fill -->
      <polygon points="45,0 54,6  45,12 36,6" fill="rgba(0,0,0,0.08)" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>

      <!-- Row 2 (offset by half a diamond width = 9px right, 6px down) -->
      <!-- diamond 4: no fill -->
      <polygon points="0,12 9,18  0,24 -9,18" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <polygon points="18,12 27,18 18,24 9,18" fill="rgba(0,0,0,0.07)" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <polygon points="36,12 45,18 36,24 27,18" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <polygon points="54,12 63,18 54,24 45,18" fill="rgba(0,0,0,0.04)" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>

      <!-- Row 3 -->
      <polygon points="9,24  18,30 9,36  0,30" fill="rgba(0,0,0,0.08)" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <polygon points="27,24 36,30 27,36 18,30" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <polygon points="45,24 54,30 45,36 36,30" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
    </pattern>

    <!-- radial fade: bright center, pattern shows at edges -->
    <radialGradient id="rfF" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="45%" stop-color="white" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="300" height="480" rx="18" fill="#f8f8f8"/>
  <!-- Diamond pattern full bleed -->
  <rect width="300" height="480" rx="18" fill="url(#dp)" clip-path="url(#cf)"/>
  <!-- Fade overlay so center is brighter -->
  <rect width="300" height="480" rx="18" fill="url(#rfF)" clip-path="url(#cf)"/>

  <!-- ── CIRCUIT TRACES — top-left area ── -->
  <g clip-path="url(#cf)" fill="none" stroke="rgba(160,160,160,0.5)" stroke-width="0.9">
    <!-- Lanyard slot — clean rectangle, NO square shape sticking up -->
    <rect x="98" y="7" width="64" height="13" rx="6.5" fill="rgba(0,0,0,0.03)" stroke="rgba(170,170,170,0.5)" stroke-width="1"/>

    <!-- Circuit lines from top-left -->
    <polyline points="0,62  42,62  56,48  180,48" stroke-width="0.8"/>
    <polyline points="0,72  36,72  50,58  145,58" stroke-width="0.7"/>
    <polyline points="56,48  56,30  80,10" stroke-width="0.8"/>
    <polyline points="50,58  50,38  72,18" stroke-width="0.7"/>
    <polyline points="80,10  105,10 115,20" stroke-width="0.8"/>
    <!-- Nodes at junctions -->
    <circle cx="56" cy="48" r="2.5" fill="rgba(150,150,150,0.5)" stroke="none"/>
    <circle cx="50" cy="58" r="2" fill="rgba(150,150,150,0.45)" stroke="none"/>
    <circle cx="80" cy="10" r="2" fill="rgba(150,150,150,0.4)" stroke="none"/>
    <circle cx="115" cy="20" r="1.5" fill="rgba(150,150,150,0.35)" stroke="none"/>

    <!-- Extra circuit branch mid-left -->
    <polyline points="0,130  28,130  38,120  90,120  102,132  140,132" stroke-width="0.7" stroke="rgba(155,155,155,0.4)"/>
    <circle cx="38" cy="120" r="2" fill="rgba(145,145,145,0.4)" stroke="none"/>
    <circle cx="102" cy="132" r="2" fill="rgba(145,145,145,0.4)" stroke="none"/>

    <!-- Right side circuit traces -->
    <polyline points="300,88  262,88  248,102  248,155  260,167  300,167" stroke-width="0.8" stroke="rgba(155,155,155,0.38)"/>
    <circle cx="248" cy="102" r="2" fill="rgba(145,145,145,0.38)" stroke="none"/>
    <circle cx="260" cy="167" r="2" fill="rgba(145,145,145,0.38)" stroke="none"/>

    <!-- Mid-right arc / circular element -->
    <circle cx="225" cy="272" r="52" stroke="rgba(175,175,175,0.22)" stroke-width="0.8"/>
    <circle cx="225" cy="272" r="38" stroke="rgba(170,170,170,0.25)" stroke-width="0.8"/>
    <circle cx="225" cy="272" r="22" stroke="rgba(165,165,165,0.3)" stroke-width="1"/>
    <circle cx="225" cy="272" r="9" stroke="rgba(160,160,160,0.35)" stroke-width="1"/>
    <circle cx="225" cy="272" r="3" fill="rgba(155,155,155,0.4)" stroke="none"/>

    <!-- Circuit lines connecting to the circle -->
    <polyline points="225,220  225,234" stroke="rgba(160,160,160,0.35)" stroke-width="0.8"/>
    <polyline points="225,310  225,324  260,324  275,310  300,310" stroke="rgba(160,160,160,0.35)" stroke-width="0.7"/>
    <circle cx="260" cy="324" r="1.8" fill="rgba(150,150,150,0.35)" stroke="none"/>

    <!-- Lower-left extra circuit -->
    <polyline points="0,320  30,320  44,308  44,285  58,272  90,272" stroke-width="0.7" stroke="rgba(155,155,155,0.35)"/>
    <circle cx="44" cy="308" r="1.8" fill="rgba(145,145,145,0.35)" stroke="none"/>
    <circle cx="58" cy="272" r="1.8" fill="rgba(145,145,145,0.35)" stroke="none"/>
  </g>

  <!-- ── BOTTOM SWOOSH — must reach the very bottom edge ── -->
  <g clip-path="url(#cf)">
    <!-- Outermost pale wave starting high enough -->
    <path d="M 300 370 Q 220 348 130 378 Q 60 402 0 432 L 0 480 L 300 480 Z" fill="rgba(205,205,205,0.5)"/>
    <path d="M 300 388 Q 225 366 138 394 Q 70 416 0 446 L 0 480 L 300 480 Z" fill="rgba(215,215,215,0.5)"/>
    <path d="M 300 406 Q 232 385 148 410 Q 82 431 10 460 L 0 480 L 300 480 Z" fill="rgba(225,225,225,0.55)"/>
    <path d="M 300 422 Q 240 402 158 426 Q 95 446 24 472 L 0 480 L 300 480 Z" fill="rgba(233,233,233,0.6)"/>
    <path d="M 300 438 Q 248 419 170 441 Q 110 458 40 478 L 0 480 L 300 480 Z" fill="rgba(240,240,240,0.65)"/>
    <!-- White solid fill — fills entire bottom so it TOUCHES the edge completely -->
    <path d="M 300 454 Q 258 436 188 454 Q 135 468 72 480 L 0 480 L 300 480 Z" fill="rgba(248,248,248,0.85)"/>
    <rect x="0" y="468" width="300" height="12" fill="white"/>
  </g>

  <!-- Card border -->
  <rect x="1" y="1" width="298" height="478" rx="17" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="2"/>
  <rect x="0" y="0" width="300" height="480" rx="18" fill="none" stroke="rgba(0,0,0,0.07)" stroke-width="1"/>
  </svg>