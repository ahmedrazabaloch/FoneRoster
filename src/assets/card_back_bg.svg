<?xml version="1.0" encoding="UTF-8"?>
<svg id="svgB" viewBox="0 0 300 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cb"><rect width="300" height="480" rx="18"/></clipPath>

    <pattern id="dpB" x="0" y="0" width="54" height="36" patternUnits="userSpaceOnUse">
      <polygon points="9,0  18,6  9,12  0,6" fill="rgba(0,0,0,0.04)" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <polygon points="27,0 36,6  27,12 18,6" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <polygon points="45,0 54,6  45,12 36,6" fill="rgba(0,0,0,0.08)" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <polygon points="0,12 9,18  0,24 -9,18" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <polygon points="18,12 27,18 18,24 9,18" fill="rgba(0,0,0,0.07)" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <polygon points="36,12 45,18 36,24 27,18" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <polygon points="54,12 63,18 54,24 45,18" fill="rgba(0,0,0,0.04)" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <polygon points="9,24  18,30 9,36  0,30" fill="rgba(0,0,0,0.08)" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <polygon points="27,24 36,30 27,36 18,30" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <polygon points="45,24 54,30 45,36 36,30" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
    </pattern>

    <radialGradient id="rfB" cx="38%" cy="50%" r="55%">
      <stop offset="0%" stop-color="white" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="300" height="480" rx="18" fill="#f8f8f8"/>
  <rect width="300" height="480" rx="18" fill="url(#dpB)" clip-path="url(#cb)"/>
  <rect width="300" height="480" rx="18" fill="url(#rfB)" clip-path="url(#cb)"/>

  <!-- ── CIRCUIT TRACES — back card ── -->
  <g clip-path="url(#cb)" fill="none">
    <!-- Top-left circuit -->
    <polyline points="0,55  35,55  48,42  160,42" stroke="rgba(158,158,158,0.42)" stroke-width="0.8"/>
    <polyline points="0,65  28,65  40,53  120,53" stroke="rgba(158,158,158,0.38)" stroke-width="0.7"/>
    <circle cx="48" cy="42" r="2.2" fill="rgba(148,148,148,0.42)" stroke="none"/>
    <circle cx="40" cy="53" r="1.8" fill="rgba(148,148,148,0.38)" stroke="none"/>

    <!-- Right side large circuit cluster (no tower — just electronics) -->
    <polyline points="300,95  255,95  240,110  240,190  255,205  300,205" stroke="rgba(155,155,155,0.38)" stroke-width="0.8"/>
    <polyline points="240,150  210,150  195,165  195,215" stroke="rgba(155,155,155,0.35)" stroke-width="0.7"/>
    <circle cx="240" cy="110" r="2.2" fill="rgba(145,145,145,0.38)" stroke="none"/>
    <circle cx="255" cy="205" r="2.2" fill="rgba(145,145,145,0.38)" stroke="none"/>
    <circle cx="210" cy="150" r="2" fill="rgba(145,145,145,0.35)" stroke="none"/>
    <circle cx="195" cy="215" r="2" fill="rgba(145,145,145,0.35)" stroke="none"/>

    <!-- Large concentric rings right-center (decorative, like original) -->
    <circle cx="230" cy="240" r="85" stroke="rgba(172,172,172,0.2)" stroke-width="0.7" fill="none"/>
    <circle cx="230" cy="240" r="65" stroke="rgba(168,168,168,0.22)" stroke-width="0.7" fill="none"/>
    <circle cx="230" cy="240" r="46" stroke="rgba(164,164,164,0.28)" stroke-width="0.8" fill="none"/>
    <circle cx="230" cy="240" r="30" stroke="rgba(160,160,160,0.32)" stroke-width="0.9" fill="none"/>
    <circle cx="230" cy="240" r="16" stroke="rgba(155,155,155,0.38)" stroke-width="1" fill="none"/>
    <circle cx="230" cy="240" r="5" fill="rgba(150,150,150,0.38)" stroke="none"/>

    <!-- Lines radiating from the circle center -->
    <line x1="230" y1="155" x2="230" y2="174" stroke="rgba(155,155,155,0.35)" stroke-width="0.8"/>
    <line x1="230" y1="306" x2="230" y2="325" stroke="rgba(155,155,155,0.35)" stroke-width="0.8"/>
    <line x1="145" y1="240" x2="164" y2="240" stroke="rgba(155,155,155,0.35)" stroke-width="0.8"/>

    <!-- Mid-left circuit branch -->
    <polyline points="0,240  22,240  36,226  80,226  94,240  145,240" stroke="rgba(152,152,152,0.35)" stroke-width="0.7"/>
    <circle cx="36" cy="226" r="2" fill="rgba(142,142,142,0.38)" stroke="none"/>
    <circle cx="94" cy="240" r="2" fill="rgba(142,142,142,0.38)" stroke="none"/>

    <!-- Lower circuit traces -->
    <polyline points="0,340  40,340  54,326  110,326  122,340  180,340" stroke="rgba(152,152,152,0.32)" stroke-width="0.7"/>
    <circle cx="54" cy="326" r="1.8" fill="rgba(142,142,142,0.35)" stroke="none"/>
    <circle cx="122" cy="340" r="1.8" fill="rgba(142,142,142,0.35)" stroke="none"/>

    <polyline points="300,300  268,300  254,314  254,355  268,368  300,368" stroke="rgba(150,150,150,0.32)" stroke-width="0.7"/>
    <circle cx="254" cy="314" r="1.8" fill="rgba(140,140,140,0.32)" stroke="none"/>
    <circle cx="268" cy="368" r="1.8" fill="rgba(140,140,140,0.32)" stroke="none"/>
  </g>

  <!-- ── RED SWOOSH — bottom right, multi-layer ── -->
  <g clip-path="url(#cb)">
    <path d="M 300 388 Q 228 366 142 395 Q 72 419 0 452 L 0 480 L 300 480 Z" fill="rgba(210,210,210,0.5)"/>
    <path d="M 300 404 Q 234 383 152 409 Q 85 432 12 462 L 0 480 L 300 480 Z" fill="rgba(255,255,255,0.88)"/>
    <path d="M 300 418 Q 242 398 166 422 Q 104 443 34 468 L 0 480 L 300 480 Z" fill="rgba(204,0,0,0.2)"/>
    <path d="M 300 432 Q 250 413 178 435 Q 120 454 54 476 L 0 480 L 300 480 Z" fill="rgba(204,0,0,0.46)"/>
    <path d="M 300 446 Q 258 428 192 448 Q 140 464 78 480 L 0 480 L 300 480 Z" fill="rgba(204,0,0,0.72)"/>
    <path d="M 300 460 Q 265 444 205 460 Q 158 473 100 480 L 0 480 L 300 480 Z" fill="#CC0000"/>
    <!-- halftone dots -->
    <g fill="rgba(160,0,0,0.4)">
      <circle cx="262" cy="466" r="2"/><circle cx="272" cy="462" r="2"/>
      <circle cx="282" cy="458" r="2"/><circle cx="292" cy="454" r="2"/>
      <circle cx="267" cy="473" r="2"/><circle cx="277" cy="469" r="2"/>
      <circle cx="287" cy="465" r="2"/><circle cx="297" cy="461" r="2"/>
      <circle cx="252" cy="470" r="2"/><circle cx="257" cy="477" r="2"/>
    </g>
    <g fill="rgba(255,255,255,0.15)">
      <circle cx="264" cy="468" r="1.4"/><circle cx="274" cy="464" r="1.4"/>
      <circle cx="284" cy="460" r="1.4"/><circle cx="269" cy="475" r="1.4"/>
      <circle cx="279" cy="471" r="1.4"/>
    </g>
  </g>

  <!-- Lanyard slot top -->
  <g clip-path="url(#cb)">
    <rect x="112" y="7" width="76" height="13" rx="6.5" fill="rgba(0,0,0,0.025)" stroke="rgba(170,170,170,0.45)" stroke-width="1"/>
  </g>

  <!-- Card border -->
  <rect x="1" y="1" width="298" height="478" rx="17" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="2"/>
  <rect x="0" y="0" width="300" height="480" rx="18" fill="none" stroke="rgba(0,0,0,0.07)" stroke-width="1"/>
  </svg>